[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-faraz"
version = "1.0.0"
description = "Agent Faraz: An autonomous terminal coding agent inspired by Claude Code, supporting local and cloud LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "pydantic>=2.5.0",
]

[project.scripts]
faraz = "faraz.cli:main"
agent-faraz = "faraz.cli:main"

[tool.setuptools.packages.find]
include = ["faraz*"]
